      "name": "Artist Launchpad",

        "https://facebook.com/artistlaunchpad"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Artist Skills Academy Courses",
        "itemListElement": [
          {
            "@type": "Course",
            "name": "Acting Fundamentals & Screen Presence",
            "description": "Comprehensive actor training covering expression, dialogue delivery, audition mastery, and camera technique.",
            "provider": { "@type": "Organization", "name": "Artist Launchpad" }
          },
          {
            "@type": "Course",
            "name": "Contemporary & Bollywood Dance Mastery",
            "description": "Rhythm, footwork, coordination, stage presence, and professional choreography.",
            "provider": { "@type": "Organization", "name": "Artist Launchpad" }
          },
          {
            "@type": "Course",
            "name": "Professional Vocal Performance & Singing",
            "description": "Vocal pitch, breath control, microphone technique, and Bollywood song interpretation.",
            "provider": { "@type": "Organization", "name": "Artist Launchpad" }
          },
          {
            "@type": "Course",
            "name": "Music Production & Sound Engineering",

            "provider": { "@type": "Organization", "name": "Artist Launchpad" }
          }
